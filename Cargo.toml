[package]
edition = "2024"
license = "MIT"
name = "moonpub"
# Real floor is 1.88: the codebase uses let-chains (`if let Some(x) = ... && cond`),
# which stabilized in 1.88. Edition 2024 alone would only require 1.85, and declaring
# 1.85 here would let `cargo install` pick a toolchain that then fails with E0658.
# Verified with `cargo +1.88.0 check --all-features --locked`; CI runs it too.
rust-version = "1.88"
version = "0.4.33"

[dependencies]
anyhow = "1"
base64 = "0.22"
chromiumoxide = "0.9.1"
futures = "0.3.32"
# Article-image preprocessing: WeChat only accepts jpg/png (<=1 MB), so SVG
# diagrams (Mermaid, charts) must be rasterized and oversized photos re-encoded.
image = { version = "0.25", default-features = false, features = [
  "png",
  "jpeg",
  "gif",
  "webp",
] }
resvg = "0.45"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
tempfile = "3"
thiserror = "2"
tokio = { version = "1.52.3", features = ["full", "macros", "rt-multi-thread"] }
ureq = { version = "2", features = ["json"] }
