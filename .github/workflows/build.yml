name: build

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: obsidian-plugin/package-lock.json

      - name: Build Obsidian plugin
        working-directory: obsidian-plugin
        run: |
          npm ci
          npm test
          npm run build

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@v2

      - name: Install cargo-nextest
        uses: taiki-e/install-action@nextest

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets --all-features --tests --benches -- -D warnings

      - name: Security audit
        run: |
          cargo install cargo-audit --locked
          cargo audit

      - name: Test
        run: cargo nextest run --all-features

  windows-smoke:
    runs-on: windows-latest
    env:
      RUSTFLAGS: ""
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@v2

      - name: Build release binary
        run: cargo build --release

      - name: Smoke test no-credential workflow
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $moonpub = Join-Path $env:GITHUB_WORKSPACE "target\release\moonpub.exe"
          $smoke = Join-Path $env:RUNNER_TEMP "moonpub-windows-smoke"
          New-Item -ItemType Directory -Force -Path $smoke | Out-Null
          Push-Location $smoke
          try {
            & $moonpub --version
            & $moonpub --help
            & $moonpub init moonpub.toml
            & $moonpub new "windows-smoke"
            & $moonpub render "Articles\drafts\windows-smoke.md"
            & $moonpub check "Articles\drafts\windows-smoke.md"
          } finally {
            Pop-Location
          }
