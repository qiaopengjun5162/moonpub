name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@v2

      - name: Install cargo-nextest
        uses: taiki-e/install-action@nextest

      - name: Check code format
        run: cargo fmt --all -- --check

      - name: Lint
        run: cargo clippy --all-targets --all-features --tests --benches -- -D warnings

      - name: Test
        run: cargo nextest run --all-features

  build:
    needs: test
    env:
      RUSTFLAGS: ""
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            suffix: linux-amd64
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
            suffix: linux-arm64
          - target: x86_64-apple-darwin
            os: macos-15-intel
            suffix: macos-amd64
          - target: aarch64-apple-darwin
            os: macos-latest
            suffix: macos-arm64
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            suffix: windows-amd64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package (Unix)
        if: runner.os != 'Windows'
        run: |
          cd target/${{ matrix.target }}/release
          tar czf moonpub-${{ matrix.suffix }}.tar.gz moonpub
          sha256sum moonpub-${{ matrix.suffix }}.tar.gz > moonpub-${{ matrix.suffix }}.tar.gz.sha256

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cd target/${{ matrix.target }}/release
          Compress-Archive -Path moonpub.exe -DestinationPath moonpub-${{ matrix.suffix }}.zip
          $hash = (Get-FileHash moonpub-${{ matrix.suffix }}.zip -Algorithm SHA256).Hash
          "$hash  moonpub-${{ matrix.suffix }}.zip" | Out-File -Encoding ASCII moonpub-${{ matrix.suffix }}.zip.sha256

      - name: Smoke test packaged Windows release zip
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $releaseDir = Join-Path $env:GITHUB_WORKSPACE "target\${{ matrix.target }}\release"
          $zipPath = Join-Path $releaseDir "moonpub-${{ matrix.suffix }}.zip"
          $extractDir = Join-Path $env:RUNNER_TEMP "moonpub-release-zip"
          $smokeDir = Join-Path $env:RUNNER_TEMP "moonpub-release-zip-smoke"
          Remove-Item -Recurse -Force $extractDir -ErrorAction SilentlyContinue
          Remove-Item -Recurse -Force $smokeDir -ErrorAction SilentlyContinue
          Expand-Archive -Path $zipPath -DestinationPath $extractDir
          $moonpub = Join-Path $extractDir "moonpub.exe"
          New-Item -ItemType Directory -Force -Path $smokeDir | Out-Null
          Push-Location $smokeDir
          try {
            & $moonpub --version
            & $moonpub --help
            & $moonpub init moonpub.toml
            & $moonpub new "Windows Smoke"
            & $moonpub render "Articles\drafts\windows-smoke.md"
            & $moonpub check "Articles\drafts\windows-smoke.md"
          } finally {
            Pop-Location
          }

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: moonpub-${{ matrix.suffix }}
          path: |
            target/${{ matrix.target }}/release/moonpub-${{ matrix.suffix }}.tar.gz
            target/${{ matrix.target }}/release/moonpub-${{ matrix.suffix }}.tar.gz.sha256
            target/${{ matrix.target }}/release/moonpub-${{ matrix.suffix }}.zip
            target/${{ matrix.target }}/release/moonpub-${{ matrix.suffix }}.zip.sha256

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: moonpub-*
          merge-multiple: true

      - name: Generate changelog
        uses: orhun/git-cliff-action@v4
        id: git-cliff
        with:
          config: cliff.toml
          args: -vv --latest --strip header
        env:
          OUTPUT: CHANGELOG.md

      - name: Release
        uses: softprops/action-gh-release@v1
        with:
          body: ${{ steps.git-cliff.outputs.content }}
          files: dist/*
          fail_on_unmatched_files: false
