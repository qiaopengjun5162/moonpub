name: build

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    # `.cargo/config.toml` pins `-C target-cpu=native` for local macOS builds.
    # GitHub runners are not guaranteed to keep the same CPU generation between
    # the compile step and the run step, so an empty RUSTFLAGS is required here
    # (2026-10-29: rustc died with SIGILL under target-cpu=native).
    env:
      RUSTFLAGS: ""
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: obsidian-plugin/package-lock.json

      - name: Build Obsidian plugin
        working-directory: obsidian-plugin
        run: |
          npm ci
          npm test
          npm run build

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@v2

      - name: Install cargo-nextest
        uses: taiki-e/install-action@nextest

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets --all-features --tests --benches -- -D warnings

      - name: Security audit
        run: |
          cargo install cargo-audit --locked
          cargo audit

      - name: Test
        run: cargo nextest run --all-features

      - name: Lint commit messages
        run: ./scripts/check-commits.sh

      - name: Lint Markdown files
        run: |
          npm install -g markdownlint-cli2
          ./scripts/lint-docs.sh --changed

  # The floor in scripts/coverage.sh guards the part of the codebase that can be
  # verified automatically. Browser automation (publish/cdp/push_browser) needs a
  # live WeChat session and is covered by the manual release gate instead.
  coverage:
    runs-on: ubuntu-latest
    env:
      RUSTFLAGS: ""
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - uses: Swatinem/rust-cache@v2

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov

      - name: Coverage floor
        run: ./scripts/coverage.sh

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  windows-smoke:
    runs-on: windows-latest
    env:
      RUSTFLAGS: ""
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@v2

      - name: Build release binary
        run: cargo build --release

      - name: Smoke test no-credential workflow
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $moonpub = Join-Path $env:GITHUB_WORKSPACE "target\release\moonpub.exe"
          $smoke = Join-Path $env:RUNNER_TEMP "moonpub-windows-smoke"
          New-Item -ItemType Directory -Force -Path $smoke | Out-Null
          Push-Location $smoke
          try {
            & $moonpub --version
            & $moonpub --help
            & $moonpub init moonpub.toml
            & $moonpub new "windows-smoke"
            & $moonpub render "Articles\drafts\windows-smoke.md"
            & $moonpub check "Articles\drafts\windows-smoke.md"
          } finally {
            Pop-Location
          }
