name: 功能建议
description: 提议新功能或改进现有工作流
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        感谢建议。MoonPub 当前优先把“本地发布核心”做稳定，再扩展平台/入口。
  - type: textarea
    id: problem
    attributes:
      label: 你想解决什么问题
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 你希望的方案
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 已考虑过的替代方案
  - type: dropdown
    id: scope
    attributes:
      label: 影响范围
      options:
        - CLI
        - Obsidian 插件
        - 浏览器自动化
        - 文档 / 首次体验
        - 其它
    validations:
      required: true
  - type: checkboxes
    id: willing
    attributes:
      label: 你愿意参与验证吗？
      options:
        - label: 愿意在实现后协助真实测试
        - label: 愿意补充文档或示例
