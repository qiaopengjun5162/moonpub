[package]
name = "moonpub"
version = "0.1.0"
edition = "2024"

[dependencies]
chromiumoxide = "0.9.1"
futures = "0.3.32"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
tokio = { version = "1.52.3", features = ["full", "macros", "rt-multi-thread"] }
ureq = { version = "2", features = ["json"] }
