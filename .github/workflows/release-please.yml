name: release-please

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    # ⚠️ 不要在这里加 `if:` 跳过「合并发版 PR」那次 push（曾于 2026-11-19 尝试，
    # 见 revert 提交）。release-please 在**同一次 run 里**既创建 release draft、
    # 又计算下一个 release PR；把整个 job 跳过，draft 就不会生成，发版流程直接
    # 卡死——「合并 PR → 等 draft → 人工 publish」这条链断在第一环。
    #
    # 代价是「合并发版 PR 之后、人工 publish draft 建好 tag 之前」这个窗口里，
    # release-please 因找不到锚点会开出一个 CHANGELOG 上百行的假发版 PR。
    # 判据与处置写在 docs/RELEASE_CHECKLIST.md：看 CHANGELOG 增量，个位数是真、
    # 几十上百行是假，关掉即可。宁可每次手动关一个空 PR，也不能让发版卡死。
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: .release-please-config.json
          manifest-file: .release-please-manifest.json
