[package]
edition = "2024"
license = "MIT"
name = "moonpub"
version = "0.4.4"

[dependencies]
anyhow = "1"
base64 = "0.22"
chromiumoxide = "0.9.1"
futures = "0.3.32"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
thiserror = "2"
tokio = { version = "1.52.3", features = ["full", "macros", "rt-multi-thread"] }
ureq = { version = "2", features = ["json"] }
